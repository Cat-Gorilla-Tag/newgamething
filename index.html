<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Unity WebGL Game</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    #unity-container {
        width: 100%;
        height: 100%;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
    }

    #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        display: none;
    }

    #unity-progress-bar-empty {
        width: 100%;
        height: 10px;
        background: #333;
    }

    #unity-progress-bar-full {
        width: 0%;
        height: 10px;
        background: #fff;
    }
</style>

</head> <body>
<div id="unity-container">
    <canvas id="unity-canvas"></canvas>

    <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>
</div>

<script src="./webgl.loader.js"></script>

<script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    var config = {
        dataUrl: "./webgl.data?v=2",
        frameworkUrl: "./webgl.framework.js?v=2",
        codeUrl: "./webgl.wasm?v=2",
        streamingAssetsUrl: "./StreamingAssets",
        companyName: "empty",
        productName: "empty",
        productVersion: "0"
    };

    loadingBar.style.display = "block";

    createUnityInstance(canvas, config, function(progress) {
        progressBarFull.style.width = (100 * progress) + "%";
        console.log("Loading: " + Math.round(progress * 100) + "%");
    })
    .then(function(unityInstance) {
        loadingBar.style.display = "none";
        window.unityInstance = unityInstance;
        console.log("Unity loaded!");
    })
    .catch(function(error) {
        console.error("Unity failed to load:", error);
    });
</script>

</body> </html>

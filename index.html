<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Unity WebGL Game</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
    }

    #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    #bar {
        width: 300px;
        height: 10px;
        background: #333;
        margin-top: 10px;
    }

    #progress {
        width: 0%;
        height: 100%;
        background: white;
    }
</style>

</head> <body>

<canvas id="unity-canvas"></canvas>

<div id="loading"> Loading... <div id="bar"> <div id="progress"></div> </div> </div> <script src="./webgl.loader.js"></script> <script> var canvas = document.getElementById("unity-canvas"); var loading = document.getElementById("loading"); var progress = document.getElementById("progress"); var config = { dataUrl: "./webgl.data", frameworkUrl: "./webgl.framework.js", codeUrl: "./webgl.wasm", streamingAssetsUrl: "./StreamingAssets", companyName: "empty", productName: "empty", productVersion: "0" }; createUnityInstance(canvas, config, function(value) { progress.style.width = (value * 100) + "%"; console.log("Loading:", Math.round(value * 100) + "%"); }) .then(function(instance) { window.unityInstance = instance; loading.style.display = "none"; console.log("Unity loaded!"); }) .catch(function(error) { console.error("Unity error:", error); loading.innerText = "Unity failed to load."; }); </script> </body> </html>
